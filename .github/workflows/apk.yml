name: APK

# Compila el APK de prueba (variante play, depuración) en GitHub y lo deja para descargar.
# Se lanza a mano: Actions > APK > Run workflow. No usa secretos ni llaves.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assemblePlayDebug --console=plain

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: litedash-personal-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14
